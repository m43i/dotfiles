# Color mode
set -g default-terminal "$TERM"
set -ag terminal-overrides ",$TERM:Tc"

# Mouse
set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"

# Start window numbering at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# reset split
unbind %
unbind l
bind l split-window -h -c "#{pane_current_path}"

unbind '"'
unbind j
bind j split-window -v -c "#{pane_current_path}"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Theme colors from Omarchy
run-shell '~/.config/tmux/omarchy-theme.sh'

# Pane borders and separators
set -g pane-border-lines heavy

set -g pane-border-status bottom

# Status bar at bottom with top border
set -g status-position bottom
set -g status-justify left
set -g status-interval 15

# Simple status bar
set -g status-left-length 50

set -g status-right-length 80

# Window status
set -g window-status-separator "  "

run '~/.tmux/plugins/tpm/tpm'

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"
